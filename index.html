
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Access</title>
<style>
body {
  background:#000;
  color:#00ff41;
  font-family:monospace;
  text-align:center;
  padding:30px 10px;
}
h1 {font-size:35px;text-shadow:0 0 15px #00ff41}
#screen {
  border:1px solid #00ff41;
  padding:20px;
  margin-top:30px;
  box-shadow:0 0 15px #00ff41;
}
#logs {text-align:left;line-height:2}
.bar {border:1px solid #00ff41;height:18px}
#progress {background:#00ff41;width:0%;height:100%}
</style>
</head>
<body>
<h1>HACKER TERMINAL</h1>
<div id="screen">
<h2>عمك حسين</h2>
<h3 id="status">INITIALIZING...</h3>
<div class="bar"><div id="progress"></div></div>
<p id="percent">0%</p>
<div id="logs"></div>
</div>
<script>
let messages=[
"Scanning phone number...",
"Establishing secure connection...",
"Analyzing device...",
"Loading virtual files...",
"Bypassing simulation...",
"ACCESS GRANTED",
"SYSTEM HACKED!"
];
let i=0,p=0;
let log=document.getElementById("logs");
let timer=setInterval(()=>{
 if(i<messages.length){
  log.innerHTML+="<div>> "+messages[i]+"</div>";
  document.getElementById("status").innerText=messages[i];
  i++;
 }
 p=Math.min(100,p+4);
 document.getElementById("progress").style.width=p+"%";
 document.getElementById("percent").innerText=p+"%";
 if(p===100){
  clearInterval(timer);
  document.getElementById("status").innerText="😂 JUST A PRANK!";
 }
},500);
</script>
</body>
</html>
